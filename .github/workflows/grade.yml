name: Grade results

on:
  schedule:
    - cron: "*/30 17-23 * * *"   # every 30 min, 1-7:30pm EDT / 12-6:30pm EST
    - cron: "*/30 0-6 * * *"     # every 30 min, 8pm-2:30am EDT / 7pm-1:30am EST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sportpredict
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.grade.outputs.changed }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: grade
        name: Grade finished games (ESPN, no odds credits)
        run: python -m sportpredict.jobs.grade_now

  publish:
    needs: grade
    if: needs.grade.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Export dashboard data
        run: |
          python -m sportpredict.jobs.export site/data.json
          cp web/* site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
