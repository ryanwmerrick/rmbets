name: Daily picks

on:
  # GitHub often starts scheduled jobs late, so there are three attempts an hour
  # apart (off the busy :00/:30 marks). The first one to start makes the picks;
  # later ones see it already ran today and exit without spending odds credits.
  schedule:
    - cron: "17 12 * * *"   # 8:17am EDT / 7:17am EST
    - cron: "17 13 * * *"   # 9:17am EDT / 8:17am EST
    - cron: "17 14 * * *"   # 10:17am EDT / 9:17am EST
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if today's picks already ran (spends odds credits again)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sportpredict
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests
      - name: Grade, snapshot odds, make picks
        run: python -m sportpredict.jobs.daily
      - name: Export dashboard data
        if: always()
        run: |
          python -m sportpredict.jobs.export site/data.json
          cp web/* site/
      - uses: actions/upload-pages-artifact@v4
        if: always()
        with:
          path: site
      - id: deploy
        if: always()
        uses: actions/deploy-pages@v4
