name: Daily picks

on:
  # GitHub starts scheduled runs anywhere from minutes to ~6 hours late, so there
  # are many attempts overnight. The first to start waits (jobs/gate.py) until
  # 8:30am ET and makes the picks; the others find nothing to do and exit.
  schedule:
    - cron: "47 0 * * *"
    - cron: "17 2 * * *"
    - cron: "47 3 * * *"
    - cron: "17 5 * * *"
    - cron: "47 6 * * *"
    - cron: "17 8 * * *"
    - cron: "47 9 * * *"
    - cron: "17 11 * * *"
    - cron: "47 12 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if today's picks already ran (spends odds credits again)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: picks
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      go: ${{ steps.go.outputs.go }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: gate
        name: Wait for the target time (scheduled runs only)
        if: github.event_name == 'schedule'
        run: python -m sportpredict.jobs.gate daily
      - id: go
        run: echo "go=${{ github.event_name != 'schedule' || steps.gate.outputs.go == 'true' }}" >> "$GITHUB_OUTPUT"
      - if: steps.go.outputs.go == 'true'
        run: pytest -q
      - name: Grade, snapshot odds, make picks
        if: steps.go.outputs.go == 'true'
        run: python -m sportpredict.jobs.daily

  publish:
    needs: run
    if: always() && needs.run.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Export dashboard data
        run: |
          python -m sportpredict.jobs.export site/data.json
          cp web/* site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
