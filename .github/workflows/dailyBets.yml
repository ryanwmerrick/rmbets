name: Daily Betting AI

on:
  # Schedule: Runs at 16:00 UTC daily
  # 16:00 UTC = 11:00 AM EST (Standard Time)
  # 16:00 UTC = 12:00 PM EDT (Daylight Savings Time)
  schedule:
    - cron: '0 16 * * *'
  
  # Manual Trigger: Allows you to click a "Run workflow" button on GitHub for testing
  workflow_dispatch:

jobs:
  run-daily-scripts:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Check out your code from the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install Python 3.9
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 3. Install your libraries (Flask, SQLAlchemy, Gemini, etc.)
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      # 4. Run the Grader (Updates yesterday's results in Neon DB)
      - name: Run Grader (Check Wins/Losses)
        env:
          # These secrets must be set in your GitHub Repo Settings
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python grader.py

      # 5. Run the Ingest (Makes today's new picks)
      - name: Run Ingest (AI Predictions)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python ingest.py
