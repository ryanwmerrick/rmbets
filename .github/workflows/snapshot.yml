name: Evening snapshot

on:
  # Same idea as daily.yml: many attempts; the first to start waits until the
  # target (4:45pm ET, plus 12:30pm on Sundays for NFL) and takes the snapshot.
  schedule:
    - cron: "47 8 * * *"
    - cron: "17 10 * * *"
    - cron: "47 11 * * *"
    - cron: "17 13 * * *"
    - cron: "47 14 * * *"
    - cron: "17 16 * * *"
    - cron: "47 17 * * *"
    - cron: "17 19 * * *"
    - cron: "47 20 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if a snapshot ran in the last 3 hours"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      go: ${{ steps.go.outputs.go }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: gate
        name: Wait for the target time (scheduled runs only)
        if: github.event_name == 'schedule'
        run: python -m sportpredict.jobs.gate snapshot
      - id: go
        run: echo "go=${{ github.event_name != 'schedule' || steps.gate.outputs.go == 'true' }}" >> "$GITHUB_OUTPUT"
      - name: Snapshot odds for CLV
        if: steps.go.outputs.go == 'true'
        run: python -m sportpredict.jobs.snapshot

  publish:
    needs: run
    if: always() && needs.run.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Export dashboard data
        run: |
          python -m sportpredict.jobs.export site/data.json
          cp web/* site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
