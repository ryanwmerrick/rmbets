name: Evening snapshot

on:
  # Two attempts; the first to start takes the snapshot and the other exits
  # (a snapshot within the last 3 hours counts as done).
  schedule:
    - cron: "17 20 * * *"   # 4:17pm EDT / 3:17pm EST
    - cron: "47 21 * * *"   # 5:47pm EDT / 4:47pm EST
    - cron: "13 16 * * 0"   # Sundays 12:13pm EDT / 11:13am EST, before 1pm NFL kickoffs
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if a snapshot ran in the last 3 hours"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sportpredict
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Snapshot odds for CLV
        run: python -m sportpredict.jobs.snapshot
      - name: Export dashboard data
        if: always()
        run: |
          python -m sportpredict.jobs.export site/data.json
          cp web/* site/
      - uses: actions/upload-pages-artifact@v4
        if: always()
        with:
          path: site
      - id: deploy
        if: always()
        uses: actions/deploy-pages@v4
